# Configuración de la app para Shopify CLI.
# 1) Ejecuta `npm run config:link` para vincularla a tu app de Shopify Partners.
# 2) `npm run dev` rellena client_id automáticamente.

client_id = ""

name = "ShopGenius AI"
handle = "shopgenius-ai"
application_url = "https://shopgenius-ai.example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[access_scopes]
# Permisos ajustados y mínimos necesarios para gestionar catálogo
scopes = "read_products,write_products"

[auth]
redirect_urls = [
  "https://shopgenius-ai.example.com/auth/callback",
  "https://shopgenius-ai.example.com/auth/shopify/callback",
  "https://shopgenius-ai.example.com/api/auth/callback"
]

[webhooks]
api_version = "2025-01"

  # Webhook de desinstalación de la app
  [[webhooks.subscriptions]]
  uri = "/webhooks"
  topics = ["app/uninstalled"]

  # Webhook de actualización de permisos/scopes
  [[webhooks.subscriptions]]
  uri = "/webhooks"
  topics = ["app/scopes_update"]

  # Sincroniza el estado del plan cuando el cliente aprueba/cancela el cobro
  [[webhooks.subscriptions]]
  uri = "/webhooks"
  topics = ["app_subscriptions/update"]

  # -------------------------------------------------------------
  # WEBHOOKS OBLIGATORIOS DE PRIVACIDAD / RGPD (Para la App Store)
  # -------------------------------------------------------------
  [[webhooks.subscriptions]]
  uri = "/webhooks"
  topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  topics = ["shop/redact"]

[pos]
embedded = false

# [app_proxy]
# Opcional: activa solo si vas a exponer endpoints públicos en el storefront (ej. widget recomendador en el tema del cliente).
# url = "https://shopgenius-ai.example.com/proxy"
# subpath = "shopgenius"
# prefix = "apps"